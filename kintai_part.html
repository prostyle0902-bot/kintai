  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f1f4f8;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-md: rgba(0,0,0,0.18);
      --text-primary: #161d28;
      --text-secondary: #646d7c;
      --text-danger: #a32d2d;
      --radius-md: 8px;
      --radius-lg: 12px;
      --accent: #1778BC;
    }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .app { width: 100%; max-width: 420px; padding: 2rem 1.25rem 3rem; }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-title { font-size: 20px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.06em; }
    .logo-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    /* Prostyle ロゴ（ブランド色 #1778BC） */
    .logo-row { display: flex; align-items: center; gap: 11px; }
    .logo-lockup { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); }
    .logo-lockup svg { display: block; }
    .lg-mark { height: 25px; width: auto; }
    .lg-word { height: 16px; width: auto; }
    .logo-div { width: 1px; height: 19px; background: var(--border-md); flex: none; }
    .screen { display: none; }
    .screen.active { display: block; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
    .pin-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem; text-align: center; }
    .pin-display { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border-md); background: transparent; transition: background 0.15s; }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
    .error-msg { text-align: center; font-size: 13px; color: var(--text-danger); height: 18px; margin-bottom: 0.75rem; }
    .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pin-btn { height: 60px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: #f7f9fb; font-size: 22px; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .pin-btn:active { transform: scale(0.94); background: #e8ebf1; }
    .pin-btn.zero { grid-column: 2; }
    .emp-name { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .dept-badge { display: inline-block; font-size: 11px; padding: 3px 12px; border-radius: 20px; margin-bottom: 1.5rem; font-weight: 500; background: #E7F2FA; color: #1778BC; }
    .time-display { font-size: 36px; font-weight: 600; color: var(--text-primary); text-align: center; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .date-display { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 1.75rem; }
    .punch-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1rem; }
    .punch-btn { height: 80px; border-radius: var(--radius-lg); font-size: 17px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .punch-btn svg { width: 24px; height: 24px; }
    .punch-btn.in { background: #E1F5EE; color: #0F6E56; }
    .punch-btn.in:active { background: #9FE1CB; transform: scale(0.96); }
    .punch-btn.out { background: #FAECE7; color: #993C1D; }
    .punch-btn.out:active { background: #F5C4B3; transform: scale(0.96); }
    .punch-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .status-box { background: #f7f9fb; border-radius: var(--radius-md); padding: 12px 16px; font-size: 13px; }
    .status-row { display: flex; justify-content: space-between; color: var(--text-secondary); padding: 4px 0; }
    .status-row span:last-child { color: var(--text-primary); font-weight: 500; }
    .apply-btn { width: 100%; margin-top: 1rem; padding: 11px; border: 0.5px solid #d4a017; border-radius: var(--radius-md); background: #fffbeb; color: #92650a; font-size: 13px; cursor: pointer; }
    .logout-btn { width: 100%; margin-top: 0.5rem; padding: 11px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; }
    .result-card { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 2.5rem 1.5rem; text-align: center; }
    .result-icon { font-size: 52px; margin-bottom: 1rem; }
    .result-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .result-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 2rem; }
    .back-btn { padding: 11px 28px; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); background: transparent; color: var(--text-primary); font-size: 14px; cursor: pointer; }
  </style>
</head>

      { pin: '2674', name: '桜庭京子',    dept: '海事・横河',          locs: [{ lat: 35.8885, lng: 140.6527, name: '海事・横河', radius: 300 }] },

      { pin: '2291', name: '高野由美',    dept: 'ニッセーデリカ',      locs: null },
      { pin: '5803', name: '村田耕一',    dept: 'ニッセーデリカ',      locs: null },
      { pin: '6925', name: '池田久史',    dept: '本社',               locs: [{ lat: 35.8580, lng: 140.5625, name: '本社', radius: 300 }] },
      { pin: '4150', name: '三浦達弥',    dept: '本社',               locs: [{ lat: 35.8580, lng: 140.5625, name: '本社', radius: 300 }] },
    ];

    /* =========================================================
       共通スタッフ名簿（入社登録アプリ onboarding.html と共有）
       開いたときに名簿を読み、上の一覧に足したり外したりします。
       通信できないときは、前に読めた内容（この端末に控えたもの）を使い、
       それも無ければ上の一覧のまま動きます。
       ========================================================= */
    const MASTER_API = 'https://script.google.com/macros/s/AKfycbxysDaJ_VU_ioCJnE856AGlgkC-zULkvCLLIMKACjNZbI8Gi5eCud4o6QhqgDFm73KP/exec';
    const MASTER_TOKEN = 'prostyle-shift-2026';
    const MASTER_KIND = 'part';          // この画面で扱う区分
    const MASTER_LS = 'prostyle_master_part';   // 前回読めた名簿の控え

    // 上の一覧をそのまま残しておく（名簿が読めないときの土台）
    const BASE_EMPLOYEES = employees.map(e => ({ pin: e.pin, name: e.name, dept: e.dept, locs: e.locs }));

    function applyMaster(list) {
      const out = BASE_EMPLOYEES.map(e => ({ pin: e.pin, name: e.name, dept: e.dept, locs: e.locs }));
      const drop = {};   // 退職した人（名前・PINのどちらでも外せるように）

      list.forEach(rec => {
        if ((rec.kind || 'part') !== MASTER_KIND) return;
        const name = String(rec.name || '').trim();
        if (!name) return;

        if (rec.status === 'retired') { drop[name] = true; if (rec.pin) drop['#' + rec.pin] = true; return; }

        let locs = null;
        try { const a = JSON.parse(rec.locs || '[]'); if (a && a.length) locs = a; } catch (e) { locs = null; }

        const emp = { pin: String(rec.pin || ''), name: name, dept: String(rec.dept || ''), locs: locs };
        if (!emp.pin) return;                       // PINが無い人はログインできないので入れない

        const i = out.findIndex(e => e.name === name);
        if (i >= 0) out[i] = emp; else out.push(emp);
      });

      const kept = out.filter(e => !drop[e.name] && !drop['#' + e.pin]);
      employees.splice(0, employees.length, ...kept);
    }

    // 前に読めた名簿があれば、通信を待たずに先に反映する
    (function () {
      try {
        const raw = localStorage.getItem(MASTER_LS);
        if (raw) applyMaster(JSON.parse(raw));
      } catch (e) { /* 控えが壊れていたら上の一覧のまま */ }
    })();

    /* 名簿を読みにいく。
       まず fetch で読む。失敗がすぐ分かるので、間をおかずに3回まで試せる。
       それでもだめなら、最後に JSONP を試す（fetch が通らない環境向け）。
       読めたら端末に控えるので、次からは通信できなくてもその内容で動く。 */
    const MASTER_SRC = MASTER_API + '?action=staffPunch&token=' + encodeURIComponent(MASTER_TOKEN);

    function useMaster(res) {
      if (!res || res.status !== 'ok' || !res.staff) return false;
      applyMaster(res.staff);
      try { localStorage.setItem(MASTER_LS, JSON.stringify(res.staff)); } catch (e) {}
      return true;
    }

    async function loadMaster() {
      if (!MASTER_API || MASTER_API.indexOf('script.google.com') < 0) return;

      for (let i = 1; i <= 3; i++) {
        try {
          const r = await fetch(MASTER_SRC + '&t=' + Date.now(), { method: 'GET', mode: 'cors' });
          if (useMaster(await r.json())) return;
        } catch (e) { /* つぎの回で試す */ }
        await new Promise(function (ok) { setTimeout(ok, 800 * i); });
      }

      // fetch が通らない環境向け。読み込みに時間がかかることがある
      loadMasterJsonp();
    }

    function loadMasterJsonp() {
      const cb = '_msc' + Date.now();
      const timer = setTimeout(giveUp, 15000);
      function cleanup() {
        clearTimeout(timer);
        delete window[cb];
        const el = document.getElementById(cb);
        if (el) el.remove();
      }
      function giveUp() { cleanup(); showMasterWarn(); }
      window[cb] = function (res) { cleanup(); if (!useMaster(res)) showMasterWarn(); };
      const sc = document.createElement('script');
      sc.id = cb;
      sc.src = MASTER_SRC + '&callback=' + cb + '&t=' + Date.now();
      sc.onerror = giveUp;
      document.head.appendChild(sc);
    }

    /* 名簿がまったく読めず、控えも無いときだけ知らせる。
       新しく入った人が「PINが違います」で困らないように。 */
    function showMasterWarn() {
      let cached = false;
      try { cached = !!localStorage.getItem(MASTER_LS); } catch (e) {}
      if (cached) return;
      const el = document.getElementById('pin-error');
      if (el) el.textContent = '名簿を読み込めませんでした（通信を確認してください）';
    }

    loadMaster();

    let pinBuffer = '';
    let currentEmp = null;
    let todayIn = null;
    let todayOut = null;
    let prevDayNoOut = false;
    let applyType = '出勤';

    function pinInput(n) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += n;
      updateDots();
      if (pinBuffer.length === 4) setTimeout(checkPin, 150);
    }

    function pinDel() {
      pinBuffer = pinBuffer.slice(0, -1);
      updateDots();
      document.getElementById('pin-error').textContent = '';
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById('d' + i).classList.toggle('filled', i < pinBuffer.length);
      }
    }

    function checkPin() {
      const emp = employees.find(e => e.pin === pinBuffer);
      if (emp) {
        currentEmp = emp;
        document.getElementById('emp-name').textContent = emp.name + ' さん';
        document.getElementById('emp-dept-badge').textContent = emp.dept;
        todayIn = null; todayOut = null; prevDayNoOut = false;
        document.getElementById('btn-in').disabled = false;
        document.getElementById('btn-out').disabled = false;
        updateStatus();
        showScreen('screen-punch');

        // ログイン時に打刻状況取得
        const d = new Date();
        const dateStr = d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
        fetch(GAS_URL, {
          method: 'POST', mode: 'cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'getStatusPA', name: emp.name, date: dateStr }),
        })
        .then(r => r.json())
        .then(res => {
          if (res.status === 'ok') {
            if (res.inTime) { todayIn = res.inTime; document.getElementById('btn-in').disabled = true; }
            if (res.outTime) { todayOut = res.outTime; document.getElementById('btn-out').disabled = true; }
            prevDayNoOut = res.prevDayNoOut || false;
            updateStatus();
          }
        })
        .catch(() => {});
      } else {
        document.getElementById('pin-error').textContent = 'PINコードが違います';
        pinBuffer = '';
        updateDots();
      }
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function getTimeStr(type) {
      const now = new Date();
      let h = now.getHours();
      let m = now.getMinutes();
      if (type === '出勤') {
        m = Math.ceil(m / 15) * 15;
        if (m === 60) { m = 0; h += 1; }
      } else {
        m = Math.floor(m / 15) * 15;
      }
      return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    }

    function updateStatus() {
      document.getElementById('st-in').textContent = todayIn || '未打刻';
      document.getElementById('st-out').textContent = todayOut || '未打刻';
    }

    function calcDist(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2-lat1)*Math.PI/180;
      const dLng = (lng2-lng1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }

    function punch(type) {
      // 退勤：出勤未打刻チェック
      if (type === '退勤' && !todayIn) {
        if (!confirm('⚠️ 出勤が記録されていません。\n打刻忘れ申請画面に移動しますか？')) return;
        showApply(); return;
      }
      // 出勤：前日退勤未打刻チェック
      if (type === '出勤' && prevDayNoOut) {
        alert('⚠️ 前日の退勤が記録されていません。\n打刻忘れ申請をしてください。');
        showApply(); return;
      }

      const allowedLocs = currentEmp.locs;
      if (allowedLocs === null) { doPunch(type, null); return; }

      document.getElementById('btn-in').disabled = true;
      document.getElementById('btn-out').disabled = true;

      if (!navigator.geolocation) {
        alert('位置情報に対応していません');
        document.getElementById('btn-in').disabled = false;
        document.getElementById('btn-out').disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          let nearest = null, minDist = Infinity;
          for (const loc of allowedLocs) {
            const dist = calcDist(lat, lng, loc.lat, loc.lng);
            if (dist < minDist) { minDist = dist; nearest = loc; }
            if (dist <= loc.radius) { doPunch(type, { lat, lng, place: loc.name }); return; }
          }
          document.getElementById('btn-in').disabled = false;
          document.getElementById('btn-out').disabled = false;
          alert('打刻できる場所にいません\n最寄り「' + nearest.name + '」まで約' + Math.round(minDist) + 'm');
        },
        () => {
          document.getElementById('btn-in').disabled = false;
          document.getElementById('btn-out').disabled = false;
          alert('位置情報を取得できませんでした');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function doPunch(type, geoInfo) {
      const t = getTimeStr(type);
      if (type === '出勤') { todayIn = t; document.getElementById('btn-in').disabled = true; }
      else { todayOut = t; document.getElementById('btn-out').disabled = true; }
      updateStatus();
      document.getElementById('done-title').textContent = type + 'を記録しました';
      document.getElementById('done-time').textContent = '記録時刻: ' + t;
      document.getElementById('done-icon').textContent = type === '出勤' ? '✅' : '🏁';
      showScreen('screen-done');

      const d = new Date();
      const dateStr = d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
      fetch(GAS_URL, {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'punchPA',
          date: dateStr, name: currentEmp.name, dept: currentEmp.dept,
          type: type, time: t,
          lat: geoInfo ? geoInfo.lat : null,
          lng: geoInfo ? geoInfo.lng : null,
          place: geoInfo ? geoInfo.place : 'フリー',
        }),
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === 'duplicate') {
          // 上書き確認
          if (confirm('⚠️ ' + res.message + '\n上書きしますか？')) {
            const d2 = new Date();
            const ds2 = d2.getFullYear() + '/' + String(d2.getMonth()+1).padStart(2,'0') + '/' + String(d2.getDate()).padStart(2,'0');
            fetch(GAS_URL, {
              method: 'POST', mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'punchPA', date: ds2, name: currentEmp.name, dept: currentEmp.dept, type: type, time: t, overwrite: true }),
            }).catch(() => {});
          }
        }
      })
      .catch(() => {});
    }

    function showPunch() { showScreen('screen-punch'); }

    function showApply() {
      const d = new Date();
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
      document.getElementById('apply-date').value = y + '-' + m + '-' + day;
      document.getElementById('apply-note').value = '';
      const sel = document.getElementById('apply-time');
      sel.innerHTML = '<option value="">-- 選択してください --</option>';
      for (let h = 6; h <= 23; h++) {
        for (let min = 0; min < 60; min += 15) {
          const opt = document.createElement('option');
          opt.value = String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
          opt.textContent = opt.value;
          sel.appendChild(opt);
        }
      }
      selectApplyType('出勤');
      showScreen('screen-apply');
    }

    function selectApplyType(type) {
      applyType = type;
      const inBtn = document.getElementById('apply-in-btn');
      const outBtn = document.getElementById('apply-out-btn');
      if (type === '出勤') {
        inBtn.style.background='#E1F5EE'; inBtn.style.color='#0F6E56'; inBtn.style.fontWeight='600';
        outBtn.style.background='#f7f9fb'; outBtn.style.color='#646d7c'; outBtn.style.fontWeight='400';
      } else {
        outBtn.style.background='#FAECE7'; outBtn.style.color='#993C1D'; outBtn.style.fontWeight='600';
        inBtn.style.background='#f7f9fb'; inBtn.style.color='#646d7c'; inBtn.style.fontWeight='400';
      }
    }

    function submitApply() {
      const dateVal = document.getElementById('apply-date').value;
      const timeVal = document.getElementById('apply-time').value;
      const note = document.getElementById('apply-note').value;
      if (!dateVal) { alert('申請日を選択してください'); return; }
      if (!timeVal) { alert('希望時刻を選択してください'); return; }
      if (!note.trim()) { alert('理由を入力してください'); return; }
      const dateStr = dateVal.replace(/-/g, '/');
      fetch(GAS_URL, {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'apply', name: currentEmp.name, dept: currentEmp.dept, date: dateStr, type: applyType, time: timeVal, note: note }),
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === 'ok') { alert('✅ 申請を送信しました'); showPunch(); }
        else { alert('エラー: ' + res.message); }
      })
      .catch(() => { alert('✅ 申請を送信しました'); showPunch(); });
    }

    function logout() {
      currentEmp = null; pinBuffer = ''; todayIn = null; todayOut = null; prevDayNoOut = false;
      updateDots();
      document.getElementById('pin-error').textContent = '';
      showScreen('screen-pin');
    }

    function tick() {
      const d = new Date();
      document.getElementById('clock').textContent = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const wd = ['日','月','火','水','木','金','土'][d.getDay()];
      document.getElementById('datestr').textContent = d.getFullYear() + ' / ' + String(d.getMonth()+1).padStart(2,'0') + ' / ' + String(d.getDate()).padStart(2,'0') + '（' + wd + '）';
    }
    setInterval(tick, 1000); tick();
  </script>
