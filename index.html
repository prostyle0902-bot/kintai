<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prostyle 勤怠</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Prostyle勤怠" />
  <meta name="theme-color" content="#1a1a18" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-md: rgba(0,0,0,0.18);
      --text-primary: #1a1a18;
      --text-secondary: #6b6b68;
      --text-danger: #a32d2d;
      --radius-md: 8px;
      --radius-lg: 12px;
    }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .app { width: 100%; max-width: 420px; padding: 2rem 1.25rem 3rem; }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-title { font-size: 20px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.06em; }
    .logo-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
    .pin-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem; text-align: center; }
    .pin-display { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border-md); background: transparent; transition: background 0.15s, border-color 0.15s; }
    .pin-dot.filled { background: var(--text-primary); border-color: var(--text-primary); }
    .error-msg { text-align: center; font-size: 13px; color: var(--text-danger); height: 18px; margin-bottom: 0.75rem; }
    .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pin-btn { height: 60px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: #f9f9f7; font-size: 22px; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .pin-btn:active { transform: scale(0.94); background: #ebebea; }
    .pin-btn.zero { grid-column: 2; }
    .pin-btn.del { font-size: 18px; }
    .emp-name { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .dept-badge { display: inline-block; font-size: 11px; padding: 3px 12px; border-radius: 20px; margin-bottom: 1.5rem; font-weight: 500; }
    .dept-業務課        { background: #E1F5EE; color: #0F6E56; }
    .dept-飲食事業部    { background: #FAECE7; color: #993C1D; }
    .dept-バックオフィス { background: #E6F1FB; color: #185FA5; }
    .time-display { font-size: 36px; font-weight: 600; color: var(--text-primary); text-align: center; margin-bottom: 4px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .date-display { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 1.75rem; }
    .punch-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1rem; }
    .punch-btn { height: 80px; border-radius: var(--radius-lg); font-size: 17px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .punch-btn svg { width: 24px; height: 24px; }
    .punch-btn.in  { background: #E1F5EE; color: #0F6E56; }
    .punch-btn.in:active  { background: #9FE1CB; transform: scale(0.96); }
    .punch-btn.out { background: #FAECE7; color: #993C1D; }
    .punch-btn.out:active { background: #F5C4B3; transform: scale(0.96); }
    .punch-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .status-box { background: #f9f9f7; border-radius: var(--radius-md); padding: 12px 16px; font-size: 13px; }
    .status-row { display: flex; justify-content: space-between; color: var(--text-secondary); padding: 4px 0; }
    .status-row span:last-child { color: var(--text-primary); font-weight: 500; }
    .apply-btn { width: 100%; margin-top: 1rem; padding: 11px; border: 0.5px solid #d4a017; border-radius: var(--radius-md); background: #fffbeb; color: #92650a; font-size: 13px; cursor: pointer; }
    .logout-btn { width: 100%; margin-top: 0.5rem; padding: 11px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; }
    .result-card { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 2.5rem 1.5rem; text-align: center; }
    .result-icon { font-size: 52px; margin-bottom: 1rem; }
    .result-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .result-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 2rem; }
    .back-btn { padding: 11px 28px; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); background: transparent; color: var(--text-primary); font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="logo">
      <div class="logo-title">Prostyle 勤怠</div>
      <div class="logo-sub">Prostyle株式会社</div>
    </div>

    <!-- PIN入力画面 -->
    <div class="screen active" id="screen-pin">
      <div class="card">
        <div class="pin-label">PINコードを入力してください</div>
        <div class="pin-display">
          <div class="pin-dot" id="d0"></div>
          <div class="pin-dot" id="d1"></div>
          <div class="pin-dot" id="d2"></div>
          <div class="pin-dot" id="d3"></div>
        </div>
        <div class="error-msg" id="pin-error"></div>
        <div class="pin-grid">
          <button class="pin-btn" onclick="pinInput('1')">1</button>
          <button class="pin-btn" onclick="pinInput('2')">2</button>
          <button class="pin-btn" onclick="pinInput('3')">3</button>
          <button class="pin-btn" onclick="pinInput('4')">4</button>
          <button class="pin-btn" onclick="pinInput('5')">5</button>
          <button class="pin-btn" onclick="pinInput('6')">6</button>
          <button class="pin-btn" onclick="pinInput('7')">7</button>
          <button class="pin-btn" onclick="pinInput('8')">8</button>
          <button class="pin-btn" onclick="pinInput('9')">9</button>
          <button class="pin-btn zero" onclick="pinInput('0')">0</button>
          <button class="pin-btn del" onclick="pinDel()">⌫</button>
        </div>
      </div>
    </div>

    <!-- 打刻画面 -->
    <div class="screen" id="screen-punch">
      <div class="card">
        <div class="emp-name" id="emp-name"></div>
        <div class="dept-badge" id="emp-dept-badge"></div>
        <div class="time-display" id="clock">--:--:--</div>
        <div class="date-display" id="datestr"></div>
        <div class="punch-btns">
          <button class="punch-btn in" id="btn-in" onclick="punch('出勤')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            出勤
          </button>
          <button class="punch-btn out" id="btn-out" onclick="punch('退勤')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            退勤
          </button>
        </div>
        <div class="status-box">
          <div class="status-row"><span>本日の出勤</span><span id="st-in">未打刻</span></div>
          <div class="status-row"><span>本日の退勤</span><span id="st-out">未打刻</span></div>
        </div>
        <button class="apply-btn" onclick="showApply()">打刻忘れ申請</button>
        <button class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <!-- 打刻完了画面 -->
    <div class="screen" id="screen-done">
      <div class="result-card">
        <div class="result-icon" id="done-icon">✅</div>
        <div class="result-title" id="done-title"></div>
        <div class="result-sub" id="done-time"></div>
        <button class="back-btn" onclick="showPunch()">戻る</button>
      </div>
    </div>

    <!-- 打刻忘れ申請画面 -->
    <div class="screen" id="screen-apply">
      <div class="card">
        <div style="font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">打刻忘れ申請</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:1.25rem;">申請内容を選んで送信してください。時刻は管理者が確認・入力します。</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">申請日</div>
        <input type="date" id="apply-date" style="width:100%;padding:10px;border:0.5px solid var(--border-md);border-radius:var(--radius-md);font-size:14px;margin-bottom:1rem;background:var(--surface);" />
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">申請種別</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;">
          <button id="apply-in-btn" onclick="selectApplyType('出勤')" style="padding:12px;border:0.5px solid var(--border);border-radius:var(--radius-md);background:#E1F5EE;color:#0F6E56;font-size:14px;font-weight:600;cursor:pointer;">出勤</button>
          <button id="apply-out-btn" onclick="selectApplyType('退勤')" style="padding:12px;border:0.5px solid var(--border);border-radius:var(--radius-md);background:#f9f9f7;color:var(--text-secondary);font-size:14px;cursor:pointer;">退勤</button>
        </div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">希望時刻</div>
        <select id="apply-time" style="width:100%;padding:10px;border:0.5px solid var(--border-md);border-radius:var(--radius-md);font-size:14px;margin-bottom:1rem;background:var(--surface);">
          <option value="">-- 選択してください --</option>
        </select>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">理由 <span style="color:#a32d2d;font-size:11px;">必須</span></div>
        <textarea id="apply-note" placeholder="例：現場直行のため打刻できませんでした" style="width:100%;padding:10px;border:0.5px solid var(--border-md);border-radius:var(--radius-md);font-size:13px;height:80px;resize:none;margin-bottom:1.25rem;"></textarea>
        <button onclick="submitApply()" style="width:100%;padding:12px;border:none;border-radius:var(--radius-md);background:#1a1a18;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:0.5rem;">申請を送信</button>
        <button onclick="showPunch()" style="width:100%;padding:10px;border:0.5px solid var(--border);border-radius:var(--radius-md);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer;">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwFtFMQftG-5Zi3cYomVqwiPIsPtjBO9Ls7LjYBLa8T23AO72qY3vEWNb-rUkhqcQcK/exec';

    const employees = [
      { pin: '3847', name: '平野 健雄', dept: '業務課',     locs: [{ lat: 35.8580, lng: 140.5625, name: '本社', radius: 500 }] },
      { pin: '6192', name: '安藤 正樹', dept: '業務課',     locs: [{ lat: 35.8580, lng: 140.5625, name: '本社', radius: 500 }] },
      { pin: '2571', name: '伏田 幸枝', dept: '業務課',     locs: [{ lat: 35.8580, lng: 140.5625, name: '本社', radius: 500 }] },
      { pin: '9034', name: '小林 俊樹', dept: '業務課',     locs: [{ lat: 35.8580, lng: 140.5625, name: '本社', radius: 500 }] },
      { pin: '4718', name: '石毛 貴英', dept: '業務課',     locs: [{ lat: 35.8580, lng: 140.5625, name: '本社', radius: 500 }] },
      { pin: '7263', name: '石毛 拓海', dept: '飲食事業部', locs: null },
      { pin: '5409', name: '花見 朗子', dept: 'バックオフィス', locs: null },
      { pin: '1836', name: '土屋 芳広', dept: '飲食事業部', locs: [{ lat: 35.8998, lng: 140.6404, name: '神栖横丁', radius: 300 }] },
      { pin: '8527', name: '及川 晶雄', dept: '飲食事業部', locs: [{ lat: 35.9831, lng: 140.6368, name: '鹿嶋事業所', radius: 300 }] },
      { pin: '3074', name: '宮川 玲奈', dept: '飲食事業部', locs: [{ lat: 35.8998, lng: 140.6404, name: '神栖横丁', radius: 300 }] },
      { pin: '6941', name: 'ハルシャニ', dept: '飲食事業部', locs: [{ lat: 35.8998, lng: 140.6404, name: '神栖横丁', radius: 300 }] },
      { pin: '2385', name: 'ナディシャ',  dept: '飲食事業部', locs: [{ lat: 35.8998, lng: 140.6404, name: '神栖横丁', radius: 300 }] },
    ];

    let pinBuffer    = '';
    let currentEmp   = null;
    let todayIn      = null;
    let todayOut     = null;
    let prevDayNoOut = false;
    let crossDayDate = null;
    let applyType    = '出勤';
    let loginDateStr = ''; // ★ ログイン時の日付を固定保持

    function pinInput(n) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += n;
      updateDots();
      if (pinBuffer.length === 4) setTimeout(checkPin, 150);
    }

    function pinDel() {
      pinBuffer = pinBuffer.slice(0, -1);
      updateDots();
      document.getElementById('pin-error').textContent = '';
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById('d' + i).classList.toggle('filled', i < pinBuffer.length);
      }
    }

    function getDateStr(d) {
      return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
    }

    function checkPin() {
      const emp = employees.find(e => e.pin === pinBuffer);
      if (emp) {
        currentEmp = emp;
        document.getElementById('emp-name').textContent = emp.name + ' さん';
        const badge = document.getElementById('emp-dept-badge');
        badge.textContent = emp.dept;
        badge.className = 'dept-badge dept-' + emp.dept;
        todayIn = null; todayOut = null; prevDayNoOut = false; crossDayDate = null;
        document.getElementById('btn-in').disabled = false;
        document.getElementById('btn-out').disabled = false;
        updateStatus();
        showScreen('screen-punch');

        // ★ ログイン時の日付を固定
        const now = new Date();
        loginDateStr = getDateStr(now);

        fetch(GAS_URL, {
          method: 'POST', mode: 'cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'getStatus', name: emp.name, date: loginDateStr }),
        })
        .then(r => r.json())
        .then(res => {
          if (res.status === 'ok') {
            if (res.inTime)  { todayIn  = res.inTime;  document.getElementById('btn-in').disabled  = true; }
            if (res.outTime) { todayOut = res.outTime; document.getElementById('btn-out').disabled = true; }
            prevDayNoOut = res.prevDayNoOut || false;
            if (res.crossDay && !res.inTime) {
              crossDayDate = res.crossDayDate;
              document.getElementById('btn-in').disabled  = true;
              document.getElementById('btn-out').disabled = false;
            }
            updateStatus();
          }
        })
        .catch(() => {});
      } else {
        document.getElementById('pin-error').textContent = 'PINコードが違います';
        pinBuffer = '';
        updateDots();
      }
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function getTimeStr(type) {
      const now = new Date();
      let h = now.getHours();
      let m = now.getMinutes();
      if (type === '出勤') {
        m = Math.ceil(m / 15) * 15;
        if (m === 60) { m = 0; h += 1; }
      } else {
        m = Math.floor(m / 15) * 15;
      }
      return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    }

    function updateStatus() {
      document.getElementById('st-in').textContent  = todayIn  || '未打刻';
      document.getElementById('st-out').textContent = todayOut || '未打刻';
    }

    function calcDist(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2-lat1)*Math.PI/180;
      const dLng = (lng2-lng1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }

    function punch(type) {
      if (type === '退勤' && !todayIn && !crossDayDate) {
        if (!confirm('⚠️ 出勤が記録されていません。\n打刻忘れ申請画面に移動しますか？')) return;
        showApply(); return;
      }
      if (type === '出勤' && prevDayNoOut) {
        alert('⚠️ 前日の退勤が記録されていません。\n打刻忘れ申請をしてください。');
        showApply(); return;
      }

      const allowedLocs = currentEmp.locs;
      if (allowedLocs === null) { doPunch(type, null); return; }

      document.getElementById('btn-in').disabled  = true;
      document.getElementById('btn-out').disabled = true;

      if (!navigator.geolocation) {
        alert('位置情報に対応していません');
        document.getElementById('btn-in').disabled  = false;
        document.getElementById('btn-out').disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          let nearest = null, minDist = Infinity;
          for (const loc of allowedLocs) {
            const dist = calcDist(lat, lng, loc.lat, loc.lng);
            if (dist < minDist) { minDist = dist; nearest = loc; }
            if (dist <= loc.radius) { doPunch(type, { lat, lng, place: loc.name }); return; }
          }
          document.getElementById('btn-in').disabled  = false;
          document.getElementById('btn-out').disabled = false;
          alert('打刻できる場所にいません\n最寄り「' + nearest.name + '」まで約' + Math.round(minDist) + 'm');
        },
        () => {
          document.getElementById('btn-in').disabled  = false;
          document.getElementById('btn-out').disabled = false;
          alert('位置情報を取得できませんでした');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function doPunch(type, geoInfo) {
      const t = getTimeStr(type);
      if (type === '出勤') { todayIn  = t; document.getElementById('btn-in').disabled  = true; }
      else                 { todayOut = t; document.getElementById('btn-out').disabled = true; }
      updateStatus();
      document.getElementById('done-title').textContent = type + 'を記録しました';
      document.getElementById('done-time').textContent  = '記録時刻: ' + t;
      document.getElementById('done-icon').textContent  = type === '出勤' ? '✅' : '🏁';
      showScreen('screen-done');

      // ★ 日付は loginDateStr を使う（日またぎでも正しい日付で送る）
      // ★ 退勤で crossDayDate がある場合はそちらを優先
      const dateStr = (type === '退勤' && crossDayDate) ? crossDayDate : loginDateStr;

      fetch(GAS_URL, {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          date: dateStr,
          name: currentEmp.name,
          dept: currentEmp.dept,
          type: type,
          time: t,
          crossDay: (type === '退勤' && crossDayDate) ? true : false,
          crossDayDate: crossDayDate,
          lat:   geoInfo ? geoInfo.lat   : null,
          lng:   geoInfo ? geoInfo.lng   : null,
          place: geoInfo ? geoInfo.place : 'フリー',
        }),
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === 'duplicate') {
          showPunch();
          if (type === '出勤') { todayIn  = null; document.getElementById('btn-in').disabled  = false; }
          else                 { todayOut = null; document.getElementById('btn-out').disabled = false; }
          updateStatus();
          alert('⚠️ ' + res.message);
        }
      })
      .catch(() => {});
    }

    function showPunch() { showScreen('screen-punch'); }

    function showApply() {
      const d = new Date();
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
      document.getElementById('apply-date').value = y + '-' + m + '-' + day;
      document.getElementById('apply-note').value = '';
      const sel = document.getElementById('apply-time');
      sel.innerHTML = '<option value="">-- 選択してください --</option>';
      for (let h = 6; h <= 23; h++) {
        for (let min = 0; min < 60; min += 15) {
          const opt = document.createElement('option');
          opt.value = String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
          opt.textContent = opt.value;
          sel.appendChild(opt);
        }
      }
      selectApplyType('出勤');
      showScreen('screen-apply');
    }

    function selectApplyType(type) {
      applyType = type;
      const inBtn  = document.getElementById('apply-in-btn');
      const outBtn = document.getElementById('apply-out-btn');
      if (type === '出勤') {
        inBtn.style.background='#E1F5EE';  inBtn.style.color='#0F6E56';  inBtn.style.fontWeight='600';
        outBtn.style.background='#f9f9f7'; outBtn.style.color='#6b6b68'; outBtn.style.fontWeight='400';
      } else {
        outBtn.style.background='#FAECE7'; outBtn.style.color='#993C1D'; outBtn.style.fontWeight='600';
        inBtn.style.background='#f9f9f7';  inBtn.style.color='#6b6b68';  inBtn.style.fontWeight='400';
      }
    }

    function submitApply() {
      const dateVal = document.getElementById('apply-date').value;
      const timeVal = document.getElementById('apply-time').value;
      const note    = document.getElementById('apply-note').value;
      if (!dateVal)     { alert('申請日を選択してください');   return; }
      if (!timeVal)     { alert('希望時刻を選択してください'); return; }
      if (!note.trim()) { alert('理由を入力してください');     return; }
      const dateStr = dateVal.replace(/-/g, '/');
      fetch(GAS_URL, {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'apply', name: currentEmp.name, dept: currentEmp.dept, date: dateStr, type: applyType, time: timeVal, note: note }),
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === 'ok') { alert('✅ 申請を送信しました'); showPunch(); }
        else { alert('エラー: ' + res.message); }
      })
      .catch(() => { alert('✅ 申請を送信しました'); showPunch(); });
    }

    function logout() {
      currentEmp = null; pinBuffer = ''; todayIn = null; todayOut = null;
      prevDayNoOut = false; crossDayDate = null; loginDateStr = '';
      updateDots();
      document.getElementById('pin-error').textContent = '';
      showScreen('screen-pin');
    }

    function tick() {
      const d = new Date();
      document.getElementById('clock').textContent = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const wd = ['日','月','火','水','木','金','土'][d.getDay()];
      document.getElementById('datestr').textContent = d.getFullYear() + ' / ' + String(d.getMonth()+1).padStart(2,'0') + ' / ' + String(d.getDate()).padStart(2,'0') + '（' + wd + '）';
    }
    setInterval(tick, 1000); tick();
  </script>
</body>
</html>
